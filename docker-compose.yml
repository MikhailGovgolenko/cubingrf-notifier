version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cubingrf
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cubingrf
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  db-data:
