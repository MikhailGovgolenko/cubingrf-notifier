services:
  db:
    image: postgres:15
    environment:
      # Credentials are supplied via the environment/.env and MUST be set
      # explicitly — there is no known default fallback in production. They must
      # match the values embedded in DATABASE_URL (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER:-cubingrf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cubingrf}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubingrf} -d ${POSTGRES_DB:-cubingrf}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    networks:
      - internal
    restart: unless-stopped
    # The app never writes to its own filesystem (DB and Telegram are network
    # I/O; PYTHONDONTWRITEBYTECODE=1 disables .pyc), so the container can run
    # with a read-only root filesystem as defense in depth.
    read_only: true

volumes:
  db-data:

networks:
  internal: