[project]
name = "cubingrf-notifier"
version = "0.1.0"
description = "Telegram notifier for CubingRF competitions"
requires-python = ">=3.13"

dependencies = [
    "aiogram>=3.0",
    "httpx>=0.24",
    "selectolax>=0.4.11",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "alembic>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
asyncio_mode = "auto"


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"